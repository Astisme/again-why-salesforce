name: Format, Lint and add changes on PR

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

permissions:
    contents: write
    pull-requests: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Setup repo
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Mark previous CI comments as outdated
              uses: actions/github-script@v7
              with:
                  script: |
                      const handler = require("./.github/scripts/mark-pr-comments-outdated.cjs");
                      await handler({
                        github,
                        context,
                        core,
                      });

            - name: Switch to branch
              run: |
                  git fetch origin "${{ github.head_ref }}"
                  git switch "${{ github.head_ref }}"
                  chmod +x .github/scripts/task-and-push-when-diff.sh

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run linter
              continue-on-error: true
              run: bun run lint > lint-error.log 2>&1

            - name: Comment on PR if linter fails
              uses: actions/github-script@v7
              with:
                  script: |
                      const handler = require("./.github/scripts/comment-on-pr.cjs");
                      await handler({
                        github,
                        context,
                        core,
                        logFile: "lint-error.log",
                        title:   "Linter Failed",
                        matchPattern: /[0-9]+ problems?/,
                        stripPatterns: [
                          /^Download https:\/\/.*\n/gm,
                          /^Initialize: .*\n/gm,
                        ]
                      });

            - name: Run tests
              continue-on-error: true
              run: bun run test > test-error.log 2>&1

            - name: Comment on PR if any test fails
              uses: actions/github-script@v7
              with:
                  script: |
                      const handler = require("./.github/scripts/comment-on-pr.cjs");
                      await handler({
                        github,
                        context,
                        core,
                        logFile: "test-error.log",
                        title:   "Tests Failed",
                        matchPattern: /\b[1-9]\d* fail\b/,
                        stripPatterns: [
                          /^\(pass\) .+\n/gm
                        ]
                      });

            - name: Comment Missing Locales
              continue-on-error: true
              run: .github/scripts/task-and-push-when-diff.sh locale-check missing-locales.log

            - name: Comment on PR if there are missing locales
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const handler = require("./.github/scripts/comment-on-pr.cjs");
                      await handler({
                        github,
                        context,
                        core,
                        logFile: "missing-locales.log",
                        title:   "These Locale Translation are missing (not blocking)",
                        stripPatterns: [
                          /^\$ bun run .+\r?$/gm,
                        ],
                      });

            - name: Sort locales
              continue-on-error: true
              run: .github/scripts/task-and-push-when-diff.sh sort locales-errors.log

            - name: Comment on PR if sorter fails
              uses: actions/github-script@v7
              with:
                  script: |
                      const handler = require("./.github/scripts/comment-on-pr.cjs");
                      await handler({
                        github,
                        context,
                        core,
                        logFile: "locales-errors.log",
                        title:   "Locale Sorter Failed",
                        matchPattern: /^(?:✖  Failed .+?: .+|Error traversing .+?: .+|Unexpected error: .+)/m,
                      });

            - name: Run formatter
              run: .github/scripts/task-and-push-when-diff.sh fmt

            - name: Run Logging Audit
              continue-on-error: true
              run: bun run audit-logging

            - name: Comment on PR if logging audit fails
              uses: actions/github-script@v7
              with:
                  script: |
                      const handler = require("./.github/scripts/comment-on-pr.cjs");
                      await handler({
                        github,
                        context,
                        core,
                        logFile: "logging-audit-report.json",
                        title:   "Logging Audit Failed (not blocking)",
                      });
